name: OCI Operator

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operator action
        required: true
        default: health
        type: choice
        options:
          - health
          - status
          - compose
          - nginx
          - docker
          - backup-preflight
          - backup-verify
          - db-integrity

jobs:
  operator:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute operator command
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.action }}' in
            health) bash operator/health_report.sh ;;
            status) bash operator/status.sh ;;
            compose) bash operator/compose_status.sh ;;
            nginx) bash operator/nginx_check.sh ;;
            docker) bash operator/docker_health.sh ;;
            backup-preflight) bash operator/backup_preflight.sh ;;
            backup-verify) bash operator/backup_verify.sh ;;
            db-integrity) bash operator/db_integrity_check.sh ;;
            *) echo 'unknown action'; exit 1 ;;
          esac
