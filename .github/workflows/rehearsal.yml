name: rehearsal

# Isolated Phase 7-5/7-6 rehearsal on a public hosted runner.
# Trigger model: workflow_dispatch ONLY — a public repo must never
# auto-run a private-checkout workflow from an untrusted event
# (no pull_request, no pull_request_target, no push triggers).
#
# Credentials:
#   OPENVEND_READ_DEPLOY_KEY — read-only deploy key on the private
#     source repo (git-read only, zero API capability, narrower than
#     any PAT). Used once, with persist-credentials: false.
#   GITHUB_TOKEN — pushes sanitized reports to the orphan `reports`
#     branch of THIS repo only.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact openvend commit SHA (full 40-hex)"
        required: true
        type: string

permissions:
  contents: write   # reports-branch push; scoped to this repo only

env:
  OUT: ${{ github.workspace }}/out
  SRC: ${{ github.workspace }}/source

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout private openvend @ exact SHA
        uses: actions/checkout@v4
        with:
          repository: suwei8/openvend
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.OPENVEND_READ_DEPLOY_KEY }}
          persist-credentials: false
          path: source

      - name: Verify exact-SHA pin (no floating refs)
        run: |
          echo "${{ inputs.source_sha }}" \
            | grep -qE '^[0-9a-f]{40}$' || {
              echo "source_sha must be a full 40-hex SHA — branch or
                    floating refs are not acceptable evidence"
              exit 1; }
          actual=$(git -C source rev-parse HEAD)
          echo "requested: ${{ inputs.source_sha }}"
          echo "actual:    $actual"
          [ "$actual" = "${{ inputs.source_sha }}" ] \
            || { echo "SHA mismatch"; exit 1; }
          echo "SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: pip install -r deploy/python-requirements.txt
        working-directory: source

      - name: Compose syntax (rehearsal stack only)
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.rehearsal.yml \
            config -q
        working-directory: source

      - name: Prepare isolated rehearsal data + test certificate
        run: |
          python tools/rehearsal_prepare.py \
            --mode synthetic --devices 25 --with-cert
        working-directory: source

      # Structural production-isolation proof — a public runner has
      # no production containers, so the guard is on CODE and
      # TOPOLOGY, not host fingerprints (the real fingerprint gate
      # stays in the private deployment-host runbook).
      - name: Production isolation — structural guard
        run: |
          ! grep -n '\.\./data:/data' \
            deploy/docker-compose.rehearsal.yml \
            || { echo "rehearsal mounts production data"; exit 1; }
          test -z "$(git status --porcelain deploy/)" \
            || { echo "rehearsal modified tracked deploy config"
                 git status --porcelain deploy/; exit 1; }
          grep -oE '127\.0\.0\.1:[0-9]+' \
            deploy/docker-compose.rehearsal.yml | sort -u
          ! grep -nE '^\s+- "?(0\.0\.0\.0:)?(80|443|8883):' \
            deploy/docker-compose.rehearsal.yml \
            || { echo "public production port bound"; exit 1; }
          echo "structural isolation: no prod mount, no prod port,
                no deploy-config drift"
        working-directory: source

      - name: Build + start rehearsal stack
        run: |
          docker compose -f deploy/docker-compose.rehearsal.yml \
            up -d --build --wait
        working-directory: source

      - name: Wait for readiness through nginx TLS+SNI
        run: |
          for i in $(seq 1 60); do
            if curl -fsS \
              --cacert data/rehearsal/certs/fullchain.pem \
              --resolve api.openvend.13982.com:19443:127.0.0.1 \
              -H "Authorization: Bearer rehearsal-admin-token" \
              https://api.openvend.13982.com:19443/api/v1/health \
              > /dev/null; then
              echo "rehearsal stack ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "rehearsal stack never became ready"
          docker compose -f deploy/docker-compose.rehearsal.yml logs
          exit 1
        working-directory: source

      - name: Compressed mixed-traffic rehearsal through nginx
        run: |
          python tools/deployment_rehearsal.py \
            --target-host 127.0.0.1 --target-port 19443 \
            --tls --server-name api.openvend.13982.com \
            --ca-file data/rehearsal/certs/fullchain.pem \
            --data-dir data/rehearsal \
            --devices 25 --interval 1.5 --uploaders 5 --readers 2 \
            --duration 25 --docker-observe
        working-directory: source

      - name: Rehearsal containers state
        run: |
          docker compose -f deploy/docker-compose.rehearsal.yml ps
          docker stats --no-stream \
            openvend-fastapi-rehearsal openvend-nginx-rehearsal \
            openvend-legacy-rehearsal
          # only loopback rehearsal ports may be published
          docker ps --format '{{.Names}} {{.Ports}}'
          ! docker ps --format '{{.Ports}}' \
            | grep -E ':(80|443|8883)->' \
            || { echo "production port bound"; exit 1; }
        working-directory: source
        if: always()

      # ---- Phase 7-6: cutover / rollback rehearsal -----------------
      # Each mechanism records its exit code rather than aborting —
      # the point is collecting ALL the A/B data; the aggregate
      # verdict step fails the job if any run did.
      - name: Init verdict ledger
        run: |
          mkdir -p "$OUT"
          : > "$OUT/verdicts.env"

      - name: Cutover rehearsal — soft reload
        run: |
          python tools/cutover.py rehearse-soft \
            --devices 25 --interval 1.5 --uploaders 5 --readers 2 \
            --duration 75 --warmup 4 --settle 2 --grace 2 \
            --leg-hold 25 \
            --drain-timeout 60 --max-latency 60 \
            --report-out "$OUT/cutover-soft.json" \
            && echo "soft=0" >> "$OUT/verdicts.env" \
            || echo "soft=$?" >> "$OUT/verdicts.env"
        working-directory: source

      - name: Cutover rehearsal — soft + worker_shutdown_timeout
        run: |
          python tools/cutover.py rehearse-soft \
            --devices 25 --interval 1.5 --uploaders 5 --readers 2 \
            --duration 75 --warmup 4 --settle 2 --grace 2 \
            --leg-hold 25 \
            --drain-timeout 60 --max-latency 60 \
            --worker-shutdown-timeout 5 \
            --report-out "$OUT/cutover-soft-wst.json" \
            && echo "soft-wst=0" >> "$OUT/verdicts.env" \
            || echo "soft-wst=$?" >> "$OUT/verdicts.env"
        working-directory: source

      - name: Cutover rehearsal — stop-first hard cut
        run: |
          python tools/cutover.py rehearse-stop-first \
            --devices 25 --interval 1.5 --uploaders 5 --readers 2 \
            --duration 75 --warmup 4 --settle 2 --grace 2 \
            --leg-hold 25 \
            --drain-timeout 60 --max-latency 60 \
            --report-out "$OUT/cutover-stopfirst.json" \
            && echo "stopfirst=0" >> "$OUT/verdicts.env" \
            || echo "stopfirst=$?" >> "$OUT/verdicts.env"
        working-directory: source

      - name: Health-gate auto-rollback injection — soft
        run: |
          python tools/cutover.py rehearse-soft \
            --devices 10 --interval 1.5 --uploaders 2 --readers 1 \
            --duration 20 --warmup 4 --settle 2 --grace 2 \
            --drain-timeout 30 --max-latency 60 --inject-gate-failure \
            --report-out "$OUT/cutover-injection-soft.json" \
            && echo "injection-soft=0" >> "$OUT/verdicts.env" \
            || echo "injection-soft=$?" >> "$OUT/verdicts.env"
          docker start openvend-fastapi-rehearsal || true
        working-directory: source

      # B's core promise on the FAILURE path: at most one serving
      # writer even when the switch fails and rolls back
      - name: Health-gate auto-rollback injection — stop-first
        run: |
          python tools/cutover.py rehearse-stop-first \
            --devices 10 --interval 1.5 --uploaders 2 --readers 1 \
            --duration 20 --warmup 4 --settle 2 --grace 2 \
            --drain-timeout 30 --max-latency 60 --inject-gate-failure \
            --report-out "$OUT/cutover-injection-stopfirst.json" \
            && echo "injection-stopfirst=0" >> "$OUT/verdicts.env" \
            || echo "injection-stopfirst=$?" >> "$OUT/verdicts.env"
          docker start openvend-fastapi-rehearsal || true
        working-directory: source

      - name: Tear down and verify port release
        run: |
          docker compose -f deploy/docker-compose.rehearsal.yml down
          for port in 19443 19810 19811; do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/${port}" \
                2>/dev/null; then
              echo "port ${port} still bound"; exit 1
            fi
          done
          echo "rehearsal ports released"
        working-directory: source
        if: always()

      - name: No rehearsal containers remain
        run: |
          leftover=$(docker ps -a --filter "name=rehearsal" -q)
          test -z "$leftover" || { echo "orphans: $leftover"; exit 1; }
          echo "no orphan rehearsal containers"
        if: always()

      # ---- sanitize -> summary -> secret-scan -> reports branch ----
      - name: Sanitize reports + secret scan + Job Summary
        run: |
          python ci/ci/sanitize.py \
            --in "$OUT" --out sanitized \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat sanitized/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()

      - name: Publish sanitized reports to reports branch
        run: |
          git clone --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            reports-out
          cd reports-out
          if git fetch origin reports:reports 2>/dev/null; then
            git checkout reports
          else
            git checkout --orphan reports
            git rm -rf . 2>/dev/null || true
          fi
          dest="reports/$SOURCE_SHA/$GITHUB_RUN_ID"
          mkdir -p "$dest"
          cp ../sanitized/*.json "$dest/"
          git config user.name "openvend-ci[bot]"
          git config user.email \
            "openvend-ci[bot]@users.noreply.github.com"
          git add -A
          git commit -qm \
            "rehearsal openvend@${SOURCE_SHA:0:12} run $GITHUB_RUN_ID"
          git push origin HEAD:reports
          echo "pushed to reports/$SOURCE_SHA/$GITHUB_RUN_ID"
        if: always()

      - name: Aggregate verdict
        run: |
          cat "$OUT/verdicts.env"
          ! grep -vE '=0$' "$OUT/verdicts.env" \
            || { echo "one or more rehearsals failed"; exit 1; }
          echo "all rehearsals passed"
